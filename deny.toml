# cargo-deny (AGENTS.md): tTorrent is MIT, so dependencies must be permissive.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    # Fonts shipped in assets/fonts, and font crates GPUI pulls in.
    "OFL-1.1",
    # webpki-roots / rustls trust anchors (data, not code).
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions, never the policy above. Owner to confirm (README › Licence notes).
exceptions = [
    # MPL-2.0 is file-level copyleft: fine to ship unmodified inside an MIT app.
    # All three arrive through GPUI (decided in PLAN.md §4); none is modified.
    { crate = "dwrote", allow = ["MPL-2.0"] },
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Through xcap (window capture) in tt-bench only, a dev tool that never ships.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# librqbit fork until the upstream PRs land (ikatson/rqbit#757, #758).
allow-git = ["https://github.com/t21dev/rqbit"]
