@property --accent { syntax: "<color>"; inherits: true; initial-value: oklch(68% 0.2 290); }

  const head=`<thead><tr><th style="width:34%">Name</th><th class="r" style="width:7%">Size</th><th style="width:15%">Progress</th><th style="width:11%">Status</th><th class="r" style="width:6%">Seeds</th><th class="r" style="width:6%">Peers</th><th class="r" style="width:8%">Down</th><th class="r" style="width:7%">Up</th><th class="r" style="width:6%">ETA</th><th class="r">Ratio</th></tr></thead>`;
  if(!rows.length){box.innerHTML=`<table>${head}</table><div class="empty">${ico("i-folder")}<b>Nothing here yet</b><span>Torrents you add to this filter show up here.<br>Drop a .torrent file anywhere, or press Ctrl O.</span></div>`;return}
  box.innerHTML=`<table>${head}<tbody>${rows.map(({r,i},k)=>{const st=ST[r.st];const cls=r.st==="seed"||r.st==="done"?"seed":r.st==="pause"||r.st==="queue"?"pause":r.st==="err"?"err":r.st==="check"?"check":"";
    return `<tr data-i="${i}" style="--i:${k}" aria-selected="${s.sel===i}"><td class="name"><span class="nm">${ico("i-file")}<span>${esc(r.n)}</span></span></td><td class="r num">${r.s}</td>
    <td><div class="prog"><div class="bar"><i class="${cls}" style="--p:${r.p}"></i></div><span class="num">${(r.p*100).toFixed(r.p===1?0:1)}%</span></div></td>
    <td><span class="st ${st[1]}">${ico(st[2])}${st[0]}</span></td><td class="r num">${r.se||""}</td><td class="r num">${r.pe||""}</td><td class="r num">${sp(r.d)}</td><td class="r num">${sp(r.u)}</td><td class="r num">${r.eta}</td><td class="r num">${r.r.toFixed(2)}</td></tr>`}).join("")}</tbody></table>`;
}
function renderPane(root,d){
  const s=state(d.id),r=s.rows[s.sel],pane=root.querySelector("[data-pane]");
  root.querySelector("[data-who]").textContent=r.n;
  if(!s.pieces||s.pieces.of!==s.sel){const n=48*5;const h=Math.round(r.p*n);const arr=Array.from({length:n},(_,i)=>i<h?(Math.random()<.93?"h":"p"):(Math.random()<.05?"p":""));for(let i=arr.length-1;i>0;i--){if(r.p<1&&Math.random()<.35){const j=Math.floor(Math.random()*n);[arr[i],arr[j]]=[arr[j],arr[i]]}}s.pieces={of:s.sel,a:arr}}
  let h="";
  if(s.tab===0){const have=s.pieces.a.filter(x=>x==="h").length;
    h=`<div class="gen"><div><div class="pm-head"><span>Pieces</span><span class="num" data-have>${have} of ${s.pieces.a.length}</span></div><div class="pm" data-pm>${s.pieces.a.map(x=>`<i class="${x}"></i>`).join("")}</div></div>
    <dl class="kv"><dt>Downloaded</dt><dd>${r.p===1?r.s:(parseFloat(r.s)*r.p).toFixed(2)+" "+r.s.split(" ")[1]}</dd><dt>Uploaded</dt><dd>${(parseFloat(r.s)*r.r).toFixed(2)} ${r.s.split(" ")[1]}</dd>
    <dt>Down speed</dt><dd data-kd>${sp(r.d)||"0 KB/s"}</dd><dt>Up speed</dt><dd>${sp(r.u)||"0 KB/s"}</dd><dt>Seeds</dt><dd>${r.se} of 1,204</dd><dt>Peers</dt><dd>${r.pe} of 311</dd>
    <dt>Ratio</dt><dd>${r.r.toFixed(2)}</dd><dt>ETA</dt><dd>${r.eta||"None"}</dd><dt>Piece size</dt><dd>2 MiB</dd><dt>Save path</dt><dd>D:\\Downloads\\${esc(r.cat)}</dd><dt>Added</dt><dd>17 Nov 2026, 21:24</dd><dt>Category</dt><dd>${esc(r.cat)}</dd></dl></div>`}
  else if(s.tab===1){h=`<table class="mini"><thead><tr><th>Tier</th><th>Tracker</th><th>Status</th><th class="r">Seeds</th><th class="r">Peers</th><th>Next announce</th></tr></thead><tbody>
    <tr><td class="num">0</td><td>https://torrent.ubuntu.com/announce</td><td><span class="st seed">${ico("i-check")}Working</span></td><td class="r num">412</td><td class="r num">38</td><td class="num">27:41</td></tr>
    <tr><td class="num">1</td><td>udp://tracker.opentrackr.org:1337</td><td><span class="st seed">${ico("i-check")}Working</span></td><td class="r num">388</td><td class="r num">52</td><td class="num">12:08</td></tr>
    <tr><td class="num"></td><td>DHT</td><td><span class="st seed">${ico("i-check")}Working</span></td><td class="r num"></td><td class="r num">119</td><td></td></tr>
    <tr><td class="num"></td><td>Peer exchange</td><td><span class="st seed">${ico("i-check")}Working</span></td><td class="r num"></td><td class="r num">24</td><td></td></tr>
    <tr><td class="num"></td><td>Local discovery</td><td><span class="st pause">${ico("i-pause")}Off for private torrents only</span></td><td></td><td></td><td></td></tr></tbody></table>`}
  else if(s.tab===2){const P=[["185.21.42.10","Germany","qBittorrent 5.1.2","1.4 MB/s","92%"],["77.111.8.203","Netherlands","Transmission 4.0.6","880 KB/s","100%"],["2a02:810::4f1","France","libtorrent 2.0.11","610 KB/s","47%"],["98.44.120.7","United States","Deluge 2.1.1","402 KB/s","100%"],["41.75.12.99","South Africa","tTorrent 0.1","95 KB/s","12%"]];
    h=`<table class="mini"><thead><tr><th>Address</th><th>Country</th><th>Client</th><th class="r">Down</th><th class="r">Progress</th></tr></thead><tbody>${P.map(p=>`<tr><td class="num">${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td class="r num">${p[3]}</td><td class="r num">${p[4]}</td></tr>`).join("")}</tbody></table>`}
  else if(s.tab===3){h=`<table class="mini"><thead><tr><th>Web seed</th><th>Status</th></tr></thead><tbody><tr><td>https://cdimage.ubuntu.com/releases/24.04.3/</td><td><span class="st seed">${ico("i-check")}Serving</span></td></tr></tbody></table>`}
  else if(s.tab===4){h=`<table class="mini tree"><thead><tr><th>Name</th><th class="r">Size</th><th>Progress</th><th>Priority</th></tr></thead><tbody>
    <tr style="--d:0"><td>${ico("i-folder")}</td><td></td><td></td><td></td></tr>`.replace(`<td>${ico("i-folder")}</td>`,`<td><span class="nm">${ico("i-folder")}<span>${esc(r.n.replace(/\.(iso|msi|xz)$/,""))}</span></span></td>`)+
    `<tr style="--d:1"><td><span class="nm">${ico("i-file")}<span>${esc(r.n)}</span></span></td><td class="r num">${r.s}</td><td><div class="prog"><div class="bar"><i style="--p:${r.p}"></i></div><span class="num">${Math.round(r.p*100)}%</span></div></td><td class="prio">Normal</td></tr>
    <tr style="--d:1"><td><span class="nm">${ico("i-file")}<span>SHA256SUMS</span></span></td><td class="r num">1 KB</td><td><div class="prog"><div class="bar"><i class="seed" style="--p:1"></i></div><span class="num">100%</span></div></td><td class="prio">High</td></tr>
    <tr style="--d:1"><td><span class="nm">${ico("i-file")}<span>README.txt</span></span></td><td class="r num">4 KB</td><td><div class="prog"><div class="bar"><i class="pause" style="--p:0"></i></div><span class="num">0%</span></div></td><td class="prio">Skip</td></tr></tbody></table>`}
  else{h=`<div class="legend"><span>Download <b data-ld></b></span><span>Upload <b data-lu></b></span><span>Last 60 seconds</span></div><svg class="spark" viewBox="0 0 600 150" preserveAspectRatio="none" data-spark></svg>`}
  pane.innerHTML=h;pane.style.animation="none";void pane.offsetWidth;pane.style.animation="";
  if(s.tab===5)drawSpark(root,d);
  moveInd(root,s.tab);
}
function drawSpark(root,d){
  const s=state(d.id),svg=root.querySelector("[data-spark]");if(!svg)return;
  const W=600,H=150,max=14,n=s.hist.length,x=i=>i/(n-1)*W,y=v=>H-6-(v/max)*(H-16);
  const pd=s.hist.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.d).toFixed(1)}`).join("");
  const pu=s.hist.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.u).toFixed(1)}`).join("");
  svg.innerHTML=[0,1,2,3].map(k=>`<path class="g" d="M0 ${(10+k*(H-16)/3).toFixed(1)}H${W}"/>`).join("")+`<path class="da" d="${pd}L${W} ${H}L0 ${H}Z"/><path class="d" d="${pd}"/><path class="u" d="${pu}"/>`;
  const last=s.hist[n-1];const ld=root.querySelector("[data-ld]"),lu=root.querySelector("[data-lu]");if(ld)ld.textContent=last.d.toFixed(1)+" MB/s";if(lu)lu.textContent=last.u.toFixed(2)+" MB/s";
}
function moveInd(root,i){const t=root.querySelector(`.tab[data-tab="${i}"]`),ind=root.querySelector(".ind");if(!t||!ind)return;ind.style.transform=`translateX(${t.offsetLeft}px) scaleX(${t.offsetWidth})`}
function statusBar(root,d){const s=state(d.id);const D=s.rows.reduce((a,r)=>a+r.d,0),U=s.rows.reduce((a,r)=>a+r.u,0);root.querySelector("[data-dl]").textContent=D.toFixed(1)+" MB/s";root.querySelector("[data-ul]").textContent=U.toFixed(2)+" MB/s"}
function counts(root,d){const s=state(d.id);root.querySelectorAll(".fl").forEach(b=>b.querySelector(".cnt").textContent=s.rows.filter(fnFor(b.dataset.f)).length)}

let toastT=null;
function toast(root,msg,undo){const t=root.querySelector(".toast");t.querySelector("[data-msg]").textContent=msg;t.classList.add("on");t._undo=undo;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),4000)}

/* ---------- page ---------- */
let cur="uv";
function renderTabs(){document.getElementById("dirtabs").innerHTML=DIRS.map(d=>`<button class="dirtab" role="tab" aria-selected="${d.id===cur}" data-dir="${d.id}">${d.name}</button>`).join("")}
function renderStage(){
  const stage=document.getElementById("stage"),d=DIRS.find(x=>x.id===cur);
  if(d.id==="logo"){stage.innerHTML=`<div class="dirpanel"><div class="dirmeta"><div><h2>Logo and app icon concepts</h2><p>Each shown as a dark and a light app icon, with its colour, at small sizes, and next to the name.</p></div></div><div class="logos">${LOGOS.map(l=>`<article class="lg" style="--mark:${l.mark}"><h3>${l.name}</h3><p>${l.line}</p>
    <div class="tiles"><div class="tile dark">${mark(l,true)}</div><div class="tile light">${mark(l,false)}</div><div class="tile acc">${mark(l,false)}</div></div>
    <div class="sizes">${mark(l,true,48)}${mark(l,true,32)}${mark(l,false,24)}${mark(l,false,16)}</div>
    <div class="lockup">${mark(l,true)}<b style="font-family:'${l.font}',ui-sans-serif,sans-serif;font-weight:${l.font==="Mona Sans"?400:600}">tTorrent</b></div></article>`).join("")}</div><p class="note">The marks are drawn on a 64 px grid, so they stay sharp at 16 px in a tray or taskbar.</p></div>`;return}
  const s=state(d.id);
  stage.innerHTML=`<div class="dirpanel"><div class="dirmeta"><div><h2>${d.name}</h2><p>${d.line}</p></div>
    <div class="swatches" role="group" aria-label="Accent"><span>Accent</span>${d.acc.map((a,i)=>`<button class="sw" style="--sw:${a[1]}" aria-label="${a[0]}" title="${a[0]}" aria-pressed="${s.acc===i}" data-acc="${i}"></button>`).join("")}</div></div>
    <div class="scroller">${appHTML(d)}</div>
    <p class="note">Click rows, filters and tabs. Pause and resume work, the piece map and speeds move live, and Uncategorized shows the empty state.</p></div>`;
  const root=stage.querySelector(".wrapapp");renderList(root,d);renderPane(root,d);statusBar(root,d);
  requestAnimationFrame(()=>moveInd(root,s.tab));
  document.fonts&&document.fonts.ready.then(()=>moveInd(root,state(d.id).tab));
}

document.addEventListener("click",e=>{
  const dt=e.target.closest(".dirtab");if(dt){cur=dt.dataset.dir;renderTabs();renderStage();return}
  const root=e.target.closest(".wrapapp");const d=DIRS.find(x=>x.id===cur);
  const sw=e.target.closest(".sw");if(sw){const s=state(d.id);s.acc=+sw.dataset.acc;document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b===sw));document.querySelector(".app").style.setProperty("--accent-default",d.acc[s.acc][1]);return}
  if(!root)return;const s=state(d.id);
  const fl=e.target.closest(".fl");if(fl){s.filter=fl.dataset.f;root.querySelectorAll(".fl").forEach(b=>b.setAttribute("aria-current",b===fl));renderList(root,d);return}
  const tr=e.target.closest("tbody tr[data-i]");if(tr){s.sel=+tr.dataset.i;root.querySelectorAll("tbody tr").forEach(r=>r.setAttribute("aria-selected",r===tr));renderPane(root,d);return}
  const tb=e.target.closest(".tab");if(tb){s.tab=+tb.dataset.tab;root.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b===tb));renderPane(root,d);return}
  const ub=e.target.closest("[data-undo]");if(ub){const t=root.querySelector(".toast");t._undo&&t._undo();t.classList.remove("on");return}
  const b=e.target.closest("[data-act]");if(b){const r=s.rows[s.sel],a=b.dataset.act;
    if(a==="alt"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);toast(root,on?"Slow mode on: 1 MB/s down, 200 KB/s up":"Slow mode off",null);return}
    if(a==="pause"&&r.st!=="pause"){const prev={st:r.st,d:r.d,u:r.u};r.st="pause";r.d=0;r.u=0;renderList(root,d);counts(root,d);statusBar(root,d);toast(root,"Stopped "+r.n,()=>{Object.assign(r,prev);renderList(root,d);counts(root,d);statusBar(root,d)});return}
    if(a==="resume"&&r.st==="pause"){r.st=r.p===1?"seed":"down";r.d=r.p===1?0:2.4;r.u=.12;r.se=r.se||88;r.pe=r.pe||12;r.eta=r.p===1?"":"9 min";renderList(root,d);counts(root,d);statusBar(root,d);toast(root,"Resumed "+r.n,null);return}
    if(a==="remove"){toast(root,"Remove "+r.n+"? Files stay on disk unless you choose otherwise.",null);return}
    if(a==="add"||a==="magnet"){toast(root,a==="add"?"Opens the add dialog: save path, category, tags, file picker":"Paste a magnet link, or several on separate lines",null);return}
  }
});
document.addEventListener("input",e=>{if(e.target.matches(".search input")){const d=DIRS.find(x=>x.id===cur);renderList(e.target.closest(".wrapapp"),d)}});
window.addEventListener("resize",()=>{const root=document.querySelector(".wrapapp");if(root)moveInd(root,state(cur).tab)});

/* live tick */
setInterval(()=>{
  const d=DIRS.find(x=>x.id===cur);if(!d||d.id==="logo")return;const root=document.querySelector(".wrapapp");if(!root)return;const s=state(d.id);
  s.rows.forEach(r=>{if(r.st==="down"){r.d=Math.max(.4,r.d+(Math.random()-.5)*1.2);r.u=Math.max(.02,r.u+(Math.random()-.5)*.08);r.p=Math.min(.999,r.p+r.d/9000)}else if(r.st==="seed"){r.u=Math.max(.05,r.u+(Math.random()-.5)*.1)}});
  const D=s.rows.reduce((a,r)=>a+r.d,0),U=s.rows.reduce((a,r)=>a+r.u,0);s.hist.push({d:D,u:U});s.hist.shift();
  statusBar(root,d);
  const mem=root.querySelector("[data-mem]");if(mem)mem.textContent=(92+Math.round(Math.random()*4))+" MB";
  root.querySelectorAll("tbody tr[data-i]").forEach(tr=>{const r=s.rows[+tr.dataset.i];const f=tr.querySelector(".bar i");f.style.setProperty("--p",r.p);tr.querySelector(".prog .num").textContent=(r.p*100).toFixed(r.p===1?0:1)+"%";const c=tr.children;c[6].textContent=sp(r.d);c[7].textContent=sp(r.u)});
  const r=s.rows[s.sel];
  if(s.tab===0&&r.st==="down"){const pm=root.querySelector("[data-pm]");if(pm){const cells=pm.children;const free=[];s.pieces.a.forEach((x,i)=>{if(x!=="h")free.push(i)});for(let k=0;k<3&&free.length;k++){const i=free.splice(Math.floor(Math.random()*free.length),1)[0];s.pieces.a[i]="h";const c=cells[i];c.className="h new";setTimeout(()=>c.classList.remove("new"),260)}
    const hv=root.querySelector("[data-have]");if(hv)hv.textContent=s.pieces.a.filter(x=>x==="h").length+" of "+s.pieces.a.length;const kd=root.querySelector("[data-kd]");if(kd)kd.textContent=sp(r.d)}}
  if(s.tab===5)drawSpark(root,d);
},1000);

renderTabs();renderStage();
</script>
