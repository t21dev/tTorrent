/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const dt=e.target.closest(".dirtab");if(dt){cur=dt.dataset.dir;closeMenus();renderTabs();renderStage();return}
  const mb=e.target.closest("[data-menu]");if(mb){openMenu===mb?closeMenus():showMenu(mb,false);return}
  const swb=e.target.closest(".switch");if(swb){swb.setAttribute("aria-checked",swb.getAttribute("aria-checked")!=="true");return}
  const sgb=e.target.closest(".sseg button");if(sgb){sgb.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===sgb));return}
  const gt=e.target.closest("[data-goto]");if(gt){document.querySelectorAll("[data-goto]").forEach(b=>b.setAttribute("aria-current",b===gt));document.querySelector(`.st-sec[data-sec="${gt.dataset.goto}"]`)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  const tri=e.target.closest("[data-tri]");if(tri){const [id,v]=tri.dataset.tri.split(":");setTri(id,v);syncTri();return}
  const al=e.target.closest("[data-all]");if(al){setAll(al.dataset.all);return}
  const icb=e.target.closest("[data-icon]");if(icb){VIEW.appIcon=+icb.dataset.icon;document.querySelectorAll("[data-icon]").forEach(b=>b.setAttribute("aria-pressed",b===icb));const t=document.querySelector(".titlebar .appico");if(t){t.outerHTML=iconTile(VIEW.appIcon,"appico enter")}toast("App icon changed: "+ICONS[VIEW.appIcon].n);return}
  const tg=e.target.closest("[data-tog]");if(tg){const [k,id]=tg.dataset.tog.split(":");toggleItem(k,id);const m=tg.closest(".menu");const kind=k==="labels"?"tb":k==="reset"?id:k;const r=m.getBoundingClientRect();const keep=document.activeElement?.dataset?.tog;checkMenu(kind,r.left,r.top);const again=document.querySelector(`.menu [data-tog="${keep}"]`);again&&again.focus();return}
  const sb=e.target.closest("[data-sub]");if(sb){ctxSubOpen(sb,true);return}
  const cc=e.target.closest("[data-ccmd]");if(cc){const c=cc.dataset.ccmd;closeMenus();document.querySelector("[data-list]")?.focus();ctxCmd(c);return}
  const mi=e.target.closest(".menu button");if(mi){const c=mi.dataset.cmd;closeMenus();cmd(c);return}
  if(!e.target.closest(".menu"))closeMenus();
  if(e.target.closest(".sheet")&&!e.target.closest("[data-closesheet]"))return;
  if(e.target.closest("[data-closesheet]")||e.target.classList.contains("sheet-bg")){document.querySelector(".sheet-bg")?.remove();document.querySelector("[data-list]")?.focus();return}
  const v=e.target.closest("[data-v]");if(v){const [k,val]=v.dataset.v.split(":");VIEW[k]=k==="scale"?+val:val;renderStage();return}
  const d=DIRS.find(x=>x.id===cur);if(!d||d.id==="logo")return;const s=state(d.id),root=document.querySelector(".app");
  const sw=e.target.closest(".sw");if(sw){s.acc=+sw.dataset.acc;document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b===sw));root.style.setProperty("--accent-default",d.acc[s.acc][VIEW.mode==="dark"?2:1]);return}
  const act=e.target.closest("[data-act]");if(act){cmd(act.dataset.act);return}
  if(!root||!root.contains(e.target))return;
  const th=e.target.closest("th[data-sort]");if(th){const k=th.dataset.sort;s.sort=s.sort.k===k?{k,dir:-s.sort.dir}:{k,dir:ASC.has(k)?1:-1};renderList(root,d);const t=root.querySelector(`th[data-sort="${k}"]`);if(document.activeElement===document.body||e.detail===0)t?.focus();return}
  const fl=e.target.closest(".fl");if(fl){s.filter=fl.dataset.f;root.querySelectorAll(".fl").forEach(b=>b.setAttribute("aria-current",b===fl));renderList(root,d);renderPane(root,d);return}
  const tr=e.target.closest("tbody tr[data-i]");if(tr){s.sel=+tr.dataset.i;root.querySelectorAll("tbody tr").forEach(x=>x.setAttribute("aria-selected",x===tr));renderPane(root,d);return}
  const tb=e.target.closest(".tab");if(tb){setTab(+tb.dataset.tab);return}
  const ub=e.target.closest("[data-undo]");if(ub){const t=root.querySelector(".toast");t._undo&&t._undo();t.classList.remove("on");return}
});
function setTab(i){const d=DIRS.find(x=>x.id===cur),s=state(d.id),root=document.querySelector(".app");s.tab=i;root.querySelectorAll(".tab").forEach(b=>{const on=+b.dataset.tab===i;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});renderPane(root,d)}
function moveSel(delta,abs){const d=DIRS.find(x=>x.id===cur),s=state(d.id),root=document.querySelector(".app"),rows=visibleRows(d);if(!rows.length)return;
  let k=rows.findIndex(x=>x.i===s.sel);k=abs==="home"?0:abs==="end"?rows.length-1:Math.max(0,Math.min(rows.length-1,k+delta));s.sel=rows[k].i;
  root.querySelectorAll("tbody tr").forEach(x=>x.setAttribute("aria-selected",+x.dataset.i===s.sel));root.querySelector(`tbody tr[data-i="${s.sel}"]`)?.scrollIntoView({block:"nearest"});renderPane(root,d)}

document.addEventListener("contextmenu",e=>{const reg=e.target.closest("[data-region]");if(!reg||!reg.closest(".app"))return;e.preventDefault();checkMenu(reg.dataset.region,e.clientX,e.clientY)});
document.addEventListener("keydown",e=>{
  const d=DIRS.find(x=>x.id===cur);if(!d||d.id==="logo")return;
  const mod=isMac()?e.metaKey:e.ctrlKey,inInput=e.target.matches("input,textarea");
  const menu=document.querySelector(".menu");
  if(e.target.matches&&e.target.matches("th[data-sort]")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();return}
  const row=e.target.closest&&e.target.closest("[data-row]");
  if(row&&e.altKey&&["ArrowUp","ArrowLeft","ArrowDown","ArrowRight"].includes(e.key)){e.preventDefault();nudge(row.dataset.row,(e.key==="ArrowUp"||e.key==="ArrowLeft")?-1:1);return}
  const ctx=document.querySelector(".menu[data-ctx]");
  if(ctx){const cm=(document.activeElement&&document.activeElement.closest(".menu"))||ctx,items=[...cm.querySelectorAll(":scope > button")],k=items.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(items[k+1]||items[0]).focus();return}
    if(e.key==="ArrowUp"){e.preventDefault();(items[k-1]||items[items.length-1]).focus();return}
    if(e.key==="ArrowRight"&&document.activeElement?.dataset?.sub){e.preventDefault();ctxSubOpen(document.activeElement,true);return}
    if(e.key==="ArrowLeft"&&cm.classList.contains("sub")){e.preventDefault();const pb=ctx.querySelector("button.open");cm.remove();pb?.classList.remove("open");pb?.focus();return}
    if((e.key==="Enter"||e.key===" ")&&k>=0){e.preventDefault();items[k].click();return}
    if(e.key==="Escape"){e.preventDefault();closeMenus();document.querySelector("[data-list]")?.focus();return}
    if(e.key==="Tab"||e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();return}}
  if((e.key==="ContextMenu"||(e.shiftKey&&e.key==="F10"))&&e.target.closest&&e.target.closest("[data-list]")){e.preventDefault();const row=document.querySelector(".app tbody tr[aria-selected='true']");if(row){const b=row.getBoundingClientRect();ctxOpen(b.left+120,b.bottom)}return}
  if(e.key==="Escape"&&e.target.id==="sq"&&e.target.value){e.preventDefault();e.target.value="";searchSettings("");return}
  if(document.querySelector(".sheet.settings")&&mod&&e.key.toLowerCase()==="f"){e.preventDefault();document.getElementById("sq")?.focus();return}
  if(e.key==="Escape"){if(menu){const b=openMenu;closeMenus();b&&b.focus();e.preventDefault();return}const sh=document.querySelector(".sheet-bg");if(sh){sh.remove();document.querySelector("[data-list]")?.focus();e.preventDefault();return}if(inInput){e.target.blur();document.querySelector("[data-list]")?.focus();return}}
  if(menu){const items=[...menu.querySelectorAll("button")],k=items.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(items[k+1]||items[0]).focus();return}
    if(e.key==="ArrowUp"){e.preventDefault();(items[k-1]||items[items.length-1]).focus();return}
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const all=[...document.querySelectorAll("[data-menu]")],j=all.indexOf(openMenu);const nb=all[(j+(e.key==="ArrowRight"?1:-1)+all.length)%all.length];showMenu(nb,true);return}
    if(e.key==="Enter"&&k>=0){e.preventDefault();items[k].click();return}}
  if(document.querySelector(".sheet-bg"))return;
  if(!isMac()&&(e.key==="F10"||(e.key==="Alt"&&!e.repeat))&&!mod){const first=document.querySelector(".app [data-menu]");if(first){e.preventDefault();showMenu(first,true)}return}
  if(mod){const k=e.key.toLowerCase();const map={o:e.shiftKey?"magnet":"add",n:"create",k:"palette",f:"find",b:"side",j:"det",s:"resume",p:"pause",r:"recheck",a:"selall","=":"zin","+":"zin","-":"zout","0":"z0",",":"prefs",w:"close",q:"quit",i:"stats",l:e.altKey?"alt":"log",c:e.shiftKey?"copy":null,enter:"open"};
    if(/^[1-6]$/.test(k)){e.preventDefault();setTab(+k-1);return}
    if(inInput&&!["k","f","b","j"].includes(k))return;
    if(map[k]){e.preventDefault();cmd(map[k]);return}return}
  if(inInput)return;
  if(e.key==="?"){e.preventDefault();sheet();return}
  const inList=e.target.closest("[data-list]");const inTabs=e.target.closest(".tabs");const inSide=e.target.closest(".side");
  if(inTabs&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){e.preventDefault();const s=state(d.id);setTab((s.tab+(e.key==="ArrowRight"?1:5))%6);document.querySelector(`.tab[data-tab="${state(d.id).tab}"]`)?.focus();return}
  if(inSide&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();const b=[...document.querySelectorAll(".fl")],k=b.indexOf(e.target.closest(".fl"));(b[k+(e.key==="ArrowDown"?1:-1)]||b[k]).focus();return}
  if(inList||e.target===document.body){
    if(e.key==="ArrowDown"){e.preventDefault();moveSel(1);return}
    if(e.key==="ArrowUp"){e.preventDefault();moveSel(-1);return}
    if(e.key==="Home"){e.preventDefault();moveSel(0,"home");return}
    if(e.key==="End"){e.preventDefault();moveSel(0,"end");return}
    if(e.key===" "){e.preventDefault();cmd("toggle");return}
    if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();cmd(e.shiftKey?"removef":"remove");return}
    if(e.key==="F2"){e.preventDefault();cmd("rename");return}
    if(e.key==="Enter"){e.preventDefault();document.querySelector(`.tab[data-tab="${state(d.id).tab}"]`)?.focus();return}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="sq"){searchSettings(e.target.value);return}if(e.target.id==="q"){const d=DIRS.find(x=>x.id===cur);renderList(document.querySelector(".app"),d)}});
window.addEventListener("resize",()=>{const root=document.querySelector(".app");if(root)moveInd(root,state(cur).tab)});

/* live tick */
setInterval(()=>{
  const d=DIRS.find(x=>x.id===cur);if(!d||d.id==="logo")return;const root=document.querySelector(".app");if(!root)return;const s=state(d.id);
  s.rows.forEach(r=>{if(r.st==="down"){r.d=Math.max(.4,r.d+(Math.random()-.5)*1.2);r.u=Math.max(.02,r.u+(Math.random()-.5)*.08);r.p=Math.min(.999,r.p+r.d/9000)}else if(r.st==="seed"){r.u=Math.max(.05,r.u+(Math.random()-.5)*.1)}});
  const D=s.rows.reduce((a,r)=>a+r.d,0),U=s.rows.reduce((a,r)=>a+r.u,0);s.hist.push({d:D,u:U});s.hist.shift();statusBar(root,d);
  const mem=root.querySelector("[data-mem]");if(mem)mem.textContent=(92+Math.round(Math.random()*4))+" MB";
  root.querySelectorAll("tbody tr[data-i]").forEach(tr=>{const r=s.rows[+tr.dataset.i];["down","up","downloaded","done","left","sdown","avail"].forEach(k=>{const td=tr.querySelector(`[data-c="${k}"]`);if(td)td.innerHTML=COLMAP[k][5](COLMAP[k][4](r),r)});const pg=tr.querySelector('[data-c="progress"]');if(pg){pg.querySelector(".bar i").style.setProperty("--p",r.p);pg.querySelector(".num").textContent=(r.p*100).toFixed(r.p===1?0:1)+"%"}});
  const r=s.rows[s.sel];
  if(s.tab===0&&r.st==="down"){const pm=root.querySelector("[data-pm]");if(pm){const cells=pm.children,free=[];s.pieces.a.forEach((x,i)=>{if(x!=="h")free.push(i)});for(let k=0;k<3&&free.length;k++){const i=free.splice(Math.floor(Math.random()*free.length),1)[0];s.pieces.a[i]="h";const c=cells[i];c.className="h new";setTimeout(()=>c.classList.remove("new"),260)}
    const hv=root.querySelector("[data-have]");if(hv)hv.textContent=s.pieces.a.filter(x=>x==="h").length+" of "+s.pieces.a.length;const kd=root.querySelector("[data-kd]");if(kd)kd.textContent=sp(r.d)}}
  if(s.tab===5)drawSpark(root,d);
},1000);

renderTabs();renderStage();
</script>
