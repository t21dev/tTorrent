[package]
name = "tt-platform"
description = "tTorrent's OS layer: data folders, memory counters, free space, tray, file association"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Tray icon and its native menu. MIT OR Apache-2.0.
tray-icon = { version = "0.26", default-features = false }
# The same windows crate gpui 0.2.2 uses.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Default handler for magnet links and .torrent files (NSWorkspace). MIT, the
# same versions gpui already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "NSWorkspace"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

# unsafe is allowed in this crate only, for OS calls, each with a SAFETY comment.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
